# Included in every location: nginx drops server-level add_header lines in a location that
# has its own add_header, so the headers are repeated through this file.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "no-referrer" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
# Scripts only from this site. connect-src allows any http(s) API because API_BASE_URL is
# configurable; inline style attributes are needed for the timer's progress bar width.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' http: https:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
